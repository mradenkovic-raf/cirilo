name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails:
    name: Rails and browser logic
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      TEST_DATABASE_PATH: storage/ci-test.sqlite3
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: bin/rails db:prepare
      - run: bin/check
      - name: Production proxy and browser persistence
        run: |
          RAILS_ENV=production DATABASE_PATH=storage/v18-production.sqlite3 SECRET_KEY_BASE_DUMMY=1 bin/rails db:prepare
          ruby qa/v18/production_check.rb

  container:
    name: Docker and persistent SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: bin/check-container
